<body>
    <!--Menu de Navegação-->
    <nav>
        <div class="logo">
            <a href="index.html" class="logo"><img src="imagens/Logo Completa.png" alt="logo da página"></a>
        </div>
        <ul>
            <li onclick="abrirMenu()" class="esconder-pc"><a href="#" class="icone">&#9776;</a></li>
            <li class="esconder-mobile"><a href="index.html">Inicio</a></li>
            <li class="esconder-mobile"><a href="adote.html">Adote</a></li>

            <li class="esconder-mobile"><a href="eventos.html">Eventos</a></li>
            <li class="esconder-mobile"><a href="contato.html">Contato</a></li>
        </ul>

        <!--Menu Mobile-->
        <ul class="menu-lateral">
            <li onclick="fecharMenu()"><a href="#" class="icone">&#10006;</a></li>
            <li><a href="index.html">Inicio</a></li>

        </ul>
        <script src="script.js"></script>

    </nav>

    <!--Principal-->
    <main>
        <div class="container">
            <div class="caixaContato">

                <div class="formulario">

                    <form action="mailto:#" method="post">
                        <h1>Fale conosco</h1>

                        <label for="i_nome"></label>
                        <input type="text" name="nome" id="i_nome" placeholder="Digite seu nome">

                        <label for="i_email"></label>
                        <input type="text" name="email" id="i_email" placeholder="Digite seu email">

                        <label for="i_msg"></label>
                        <textarea name="msg" id="i_msg" placeholder="Digite sua mensagem"></textarea>

                        <div class="btn">
                            <button type="submit">Enviar</button>
                            <button type="reset">Limpar</button>
                        </div>
                    </form>

                </div>
                <!-- 🔥 NOVO CONTAINER DAS REDES -->
                <div class="redes-container">

                    <div class="titulo-redessociais">
                        <h1>Ou acesse nossas redes sociais</h1>
                    </div>

                    <div class="redesSociais">
                        <!--tik tok, insta, face e X-->
                        <a href="#"><i class="bi bi-instagram"></i></a>
                        <a href="#"><i class="bi bi-tiktok"></i></a>
                        <a href="#"><i class="bi bi-facebook"></i></a>
                        <a href="#"><i class="bi bi-twitter-x"></i></a>
                    </div>

                </div>

            </div>
        </div>
        </div>
    </main>
</body>
