  <body>
    <!--Menu de Navegação-->
    <nav>
      <div class="logo">
        <a href="index.html" class="logo"
          ><img src="imagens/Logo Completa branca.png" alt="logo da página"
        /></a>
      </div>
      <ul>
        <li onclick="abrirMenu()" class="esconder-pc">
          <a href="#" class="icone">&#9776;</a>
        </li>
        <li class="esconder-mobile"><a href="index.html">Inicio</a></li>
        <li class="esconder-mobile"><a href="adote.html">Adote</a></li>
        <li class="esconder-mobile"><a href="sobre.html">Sobre Nós</a></li>
        <li class="esconder-mobile"><a href="eventos.html">Eventos</a></li>
        <li class="esconder-mobile"><a href="contato.html">Contato</a></li>
        <li class="esconder-mobile">
          <a href="cadastro_pet.html">Cadastrar Pet</a>
        </li>
      </ul>

      <!--Menu Mobile-->
      <ul class="menu-lateral">
        <li onclick="fecharMenu()"><a href="#" class="icone">&#10006;</a></li>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="adote.html">Adote</a></li>
        <li><a href="sobre.html">Sobre Nós</a></li>
        <li><a href="eventos.html">Eventos</a></li>
        <li><a href="contato.html">Contato</a></li>
        <li><a href="cadastro_pet.html">Cadastrar Pet</a></li>
      </ul>
      <script src="script.js"></script>
    </nav>

    <main>
      <div class="container">
        <form action="#">
          <div class="form-header">
            <h1>🐾Cadastrar Pet🐾</h1>
            <h2>Ajude um animal a encontrar um lar</h2>
          </div>

          <div class="informacoes_pet">
            <h2>Informações do pet</h2>
            <label for="nome">
              Nome
              <div class="input_field">
                <input type="text" id="nome" name="nome" required />
              </div>
            </label>

            <label for="raca">
              Raça
              <div class="input_field">
                <input type="text" id="raca" name="raca" required />
              </div>
            </label>

            <label for="idade">
              Idade
              <div class="input_field">
                <input type="number" id="idade" name="idade" min="0" required />
              </div>
            </label>

            <label for="especie">
              Especie
              <div class="input_field">
                <select name="especia" id="especie">
                  <option value="">Selecione</option>
                  <option value="cachorro">Cachorro</option>
                  <option value="gato">Gato</option>
                  <option value="coelho">Coelho</option>
                  <option value="outro">Outro</option>
                </select>
              </div>
            </label>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
